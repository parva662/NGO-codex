<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حق‌یار</title><style>body{margin:0;background:#091421;color:#f5f7fa;font-family:Tahoma,Arial}.app{max-width:760px;margin:auto;padding:16px 15px 90px}.card{background:#111f2e;border:1px solid #294056;border-radius:20px;padding:17px;margin:12px 0}.hero{background:linear-gradient(135deg,#13283a,#12372f)}h1{font-size:25px}.muted{color:#9fb2c5}.small{font-size:12px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.btn,.cat{font:inherit;border-radius:14px;padding:13px;border:1px solid #294056;background:#172a3c;color:#fff}.cat{text-align:right}.cat b{display:block}.cat span{font-size:11px;color:#9fb2c5}.primary{background:#49d4a4;color:#06261c;font-weight:bold}.field{font:inherit;width:100%;box-sizing:border-box;background:#091725;color:white;border:1px solid #294056;border-radius:13px;padding:13px;margin:5px 0}.opt{display:block;background:#091725;border:1px solid #294056;border-radius:13px;padding:12px;margin:8px 0}.hidden{display:none}.row{display:flex;gap:8px}.row>*{flex:1}.progress{height:7px;background:#213448;border-radius:10px;overflow:hidden}.progress div{height:100%;background:#49d4a4}.footer{position:fixed;bottom:0;left:0;right:0;background:#07101bea;padding:10px}.foot{max-width:760px;margin:auto;display:flex;gap:8px}.pill{display:inline-block;padding:6px 9px;border-radius:20px;background:#164234;color:#a8f2da}.warn{background:#4a351a;color:#ffd38b}.red{background:#4c222b;color:#ffc0c9}.case{background:#0b1927;border:1px solid #294056;border-radius:13px;padding:12px;margin:8px 0}pre{white-space:pre-wrap;line-height:1.8;background:#081522;padding:12px;border-radius:13px;max-height:350px;overflow:auto}@media(max-width:520px){.grid{grid-template-columns:1fr}.row{flex-direction:column}}</style></head><body><div class="app"><h2>حق‌یار <span class="muted small">v0.4 • آفلاین</span></h2><section id="home"><div id="pmini" class="card"></div><div class="card hero"><h1>پرونده حقوقی هوشمند بساز</h1><p class="muted">سؤال‌ها بر اساس پاسخ‌های تو تغییر می‌کنند و در پایان یک پرونده استاندارد AI-ready می‌گیری.</p></div><div class="card"><h3>موضوع پرونده</h3><div id="cats" class="grid"></div></div><div class="card"><div class="row"><button class="btn" onclick="historyPage()">تاریخچه پرونده‌ها</button><button class="btn" onclick="profilePage()">پروفایل</button></div></div></section><section id="profile" class="hidden"><div class="card"><h2>پروفایل کاربر</h2><input id="pn" class="field" placeholder="نام و نام خانوادگی"><input id="pp" class="field" placeholder="شماره تماس - اختیاری"><select id="pv" class="field"></select><input id="pc" class="field" placeholder="شهر"><textarea id="pnote" class="field" placeholder="توضیح اختیاری"></textarea><div class="row"><button class="btn primary" onclick="saveProfile()">ذخیره</button><button class="btn" onclick="home()">بازگشت</button></div></div></section><section id="intake" class="hidden"><div class="card"><div id="catname" class="muted small"></div><div id="step" style="margin:7px 0"></div><div class="progress"><div id="bar"></div></div><div id="qw"></div></div></section><section id="result" class="hidden"><div class="card"><h2>پرونده AI-ready آماده است</h2><div id="risk"></div><p id="doc"></p><pre id="preview"></pre><div class="row"><button class="btn primary" onclick="outJSON()">JSON</button><button class="btn" onclick="outTXT()">متن</button><button class="btn" onclick="outPDF()">PDF</button></div><button class="btn" style="margin-top:8px;width:100%" onclick="home()">صفحه اصلی</button></div></section><section id="history" class="hidden"><div class="card"><h2>تاریخچه پرونده‌ها</h2><div id="hist"></div><button class="btn" onclick="home()">بازگشت</button></div></section></div><div id="footer" class="footer hidden"><div class="foot"><button class="btn" onclick="prev()">قبلی</button><button class="btn primary" onclick="next()">بعدی</button></div></div><script>const P=['آذربایجان شرقی','آذربایجان غربی','اردبیل','اصفهان','البرز','ایلام','بوشهر','تهران','چهارمحال و بختیاری','خراسان جنوبی','خراسان رضوی','خراسان شمالی','خوزستان','زنجان','سمنان','سیستان و بلوچستان','فارس','قزوین','قم','کردستان','کرمان','کرمانشاه','کهگیلویه و بویراحمد','گلستان','گیلان','لرستان','مازندران','مرکزی','هرمزگان','همدان','یزد'];const C={property:['ملکی و اجاره','اجاره، تخلیه، خریدوفروش، سند'],family:['خانواده','طلاق، مهریه، نفقه، حضانت'],debt:['چک و مطالبات','چک، سفته، بدهی'],work:['کار و استخدام','اخراج، حقوق، بیمه'],contract:['قراردادها','نقض تعهد، فسخ، خسارت'],criminal:['کیفری','شکایت، اتهام، تهدید'],business:['کسب‌وکار','شرکت، شریک، مشتری'],other:['سایر','سایر مسائل حقوقی']};const Q=(id,t,x,o=[],cond=null)=>({id,t,x,o,cond});const BASE=[Q('summary','area','ماجرا را با ترتیب زمانی توضیح بده.'),Q('role','text','نقش تو در این موضوع چیست؟'),Q('party','text','طرف مقابل چه شخص یا مجموعه‌ای است؟'),Q('province','select','پرونده مربوط به کدام استان است؟',P),Q('city','text','شهر یا شهرستان مرتبط چیست؟'),Q('stage','radio','پرونده در چه مرحله‌ای است؟',['هنوز اقدام رسمی نکرده‌ام','اظهارنامه/مذاکره','دادخواست یا شکایت ثبت شده','در حال رسیدگی','رأی صادر شده','مرحله اجرا','نمی‌دانم']),Q('caseNo','text','شماره پرونده یا کلاسه چیست؟',[],a=>['دادخواست یا شکایت ثبت شده','در حال رسیدگی','رأی صادر شده','مرحله اجرا'].includes(a.stage)),Q('branch','text','شعبه یا مرجع رسیدگی چیست؟',[],a=>['در حال رسیدگی','رأی صادر شده','مرحله اجرا'].includes(a.stage)),Q('noticeDate','text','تاریخ آخرین ابلاغ یا رأی چیست؟',[],a=>['در حال رسیدگی','رأی صادر شده','مرحله اجرا'].includes(a.stage)),Q('urgent','radio','آیا مهلت قانونی، جلسه یا اقدام فوری داری؟',['بله','خیر','مطمئن نیستم']),Q('deadline','text','مهلت یا تاریخ جلسه را وارد کن.',[],a=>a.urgent==='بله'),Q('amount','text','ارزش مالی موضوع تقریباً چقدر است؟'),Q('docs','area','چه مدارکی داری؟ قرارداد، پیام، رسید، سند، ابلاغیه، شاهد...'),Q('evidence','radio','وضعیت مدارک چگونه است؟',['قوی و کامل','بخشی را دارم','مدرک کمی دارم','مطمئن نیستم']),Q('actions','area','تا الان چه اقداماتی انجام داده‌ای؟'),Q('goal','area','دقیقاً چه نتیجه‌ای می‌خواهی؟'),Q('output','radio','چه خروجی می‌خواهی؟',['تحلیل و راهکار','اظهارنامه','دادخواست','شکواییه','لایحه/دفاعیه','قرارداد/اصلاح قرارداد','نامه مطالبه','خلاصه برای وکیل','حق‌یار پیشنهاد دهد'])];const E={property:[Q('kind','radio','موضوع ملکی دقیقاً چیست؟',['اجاره و ودیعه','تخلیه','خرید و فروش','مالکیت و سند','تصرف/مزاحمت','ساخت‌وساز','سایر']),Q('lease','radio','قرارداد اجاره کتبی داری؟',['بله','خیر'],a=>['اجاره و ودیعه','تخلیه'].includes(a.kind)),Q('tracking','radio','قرارداد کد رهگیری دارد؟',['بله','خیر','نمی‌دانم'],a=>a.lease==='بله'),Q('deposit','text','مبلغ ودیعه چقدر است؟',[],a=>['اجاره و ودیعه','تخلیه'].includes(a.kind)),Q('leaseEnd','text','تاریخ پایان اجاره چیست؟',[],a=>a.lease==='بله'),Q('deed','radio','سند مالکیت رسمی وجود دارد؟',['بله','خیر','نمی‌دانم']),Q('possession','area','ملک اکنون در تصرف چه کسی است؟')],family:[Q('kind','radio','موضوع خانوادگی چیست؟',['طلاق','مهریه','نفقه','حضانت','تمکین','ارث','سایر']),Q('marriage','radio','نوع ازدواج چیست؟',['دائم','موقت','مرتبط نیست'],a=>['طلاق','مهریه','نفقه','تمکین'].includes(a.kind)),Q('children','radio','فرزند مشترک دارید؟',['بله','خیر'],a=>['طلاق','حضانت','نفقه'].includes(a.kind)),Q('childInfo','area','سن و وضعیت نگهداری فرزندان را بنویس.',[],a=>a.children==='بله'),Q('dowry','text','میزان مهریه چیست؟',[],a=>['مهریه','طلاق'].includes(a.kind)),Q('violence','radio','تهدید یا خشونت فوری وجود دارد؟',['بله','خیر'])],debt:[Q('instrument','radio','مبنای طلب چیست؟',['چک','سفته','قرارداد','فاکتور/رسید','قرض/انتقال وجه','سایر']),Q('due','text','تاریخ سررسید چیست؟'),Q('sayad','radio','چک در صیاد ثبت و تأیید شده؟',['بله','خیر','نمی‌دانم'],a=>a.instrument==='چک'),Q('returnCert','radio','گواهی عدم پرداخت گرفته‌ای؟',['بله','خیر'],a=>a.instrument==='چک'),Q('guarantor','radio','ضامن یا ظهرنویس وجود دارد؟',['بله','خیر','نمی‌دانم'],a=>['چک','سفته'].includes(a.instrument)),Q('proof','area','مهم‌ترین مدرک اثبات طلب چیست؟')],work:[Q('employment','radio','رابطه کاری چگونه بوده؟',['قرارداد کتبی','توافق شفاهی','پیمانکاری/فریلنس','رسمی/دولتی','سایر']),Q('start','text','تاریخ شروع کار؟'),Q('end','text','تاریخ پایان یا اخراج؟'),Q('insured','radio','بیمه برایت رد شده؟',['بله','خیر','بخشی از مدت','نمی‌دانم']),Q('kind','radio','موضوع اختلاف چیست؟',['حقوق معوق','اخراج','بیمه','سنوات/عیدی','اضافه‌کاری','قرارداد','سایر']),Q('salary','text','آخرین حقوق ماهانه؟')],contract:[Q('written','radio','قرارداد کتبی و امضا شده؟',['بله','خیر','فقط پیش‌نویس']),Q('date','text','تاریخ قرارداد؟',[],a=>a.written==='بله'),Q('value','text','ارزش قرارداد؟'),Q('breach','area','کدام تعهد یا بند نقض شده؟'),Q('penalty','radio','شرط فسخ یا وجه التزام دارد؟',['بله','خیر','نمی‌دانم'],a=>a.written==='بله'),Q('arbitration','radio','شرط داوری دارد؟',['بله','خیر','نمی‌دانم'],a=>a.written==='بله')],criminal:[Q('criminalRole','radio','وضعیت تو چیست؟',['شاکی/بزه‌دیده','متهم','شاهد','هنوز پرونده تشکیل نشده']),Q('offense','text','عنوان یا شرح اتهام/جرم چیست؟'),Q('incidentDate','text','تاریخ وقوع؟'),Q('place','text','محل وقوع؟'),Q('custody','radio','بازداشت یا خطر بازداشت فوری وجود دارد؟',['بله','خیر','نمی‌دانم']),Q('safety','radio','خطر فوری برای جان یا سلامت وجود دارد؟',['بله','خیر']),Q('witness','area','شاهد، دوربین، پیام یا مدرک دیجیتال داری؟')],business:[Q('form','radio','نوع فعالیت چیست؟',['شخص حقیقی','مسئولیت محدود','سهامی خاص','مؤسسه','تیم ثبت‌نشده','سایر']),Q('kind','radio','موضوع اصلی چیست؟',['اختلاف شریک/سهامدار','قرارداد مشتری','کارمند','وصول مطالبات','مالکیت فکری','مجوز/اداری','سایر']),Q('authority','radio','اسناد ثبتی و صاحبان امضا مشخص‌اند؟',['بله','خیر','مرتبط نیست']),Q('companyDocs','area','اسناد شرکتی مرتبط را فهرست کن.')],other:[Q('topic','text','موضوع را در چند کلمه نام‌گذاری کن.')]} ;let S=null,last=null;const g=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function show(x){['home','profile','intake','result','history'].forEach(i=>g(i).classList.toggle('hidden',i!==x));g('footer').classList.add('hidden')}function prof(){try{return JSON.parse(localStorage.hp||'{}')}catch(e){return{}}}function list(){try{return JSON.parse(localStorage.hcases||'[]')}catch(e){return[]}}function init(){g('cats').innerHTML=Object.entries(C).map(([k,v])=>'<button class="cat" onclick="startCase(\''+k+'\')"><b>'+v[0]+'</b><span>'+v[1]+'</span></button>').join('');home()}function home(){show('home');let p=prof();g('pmini').innerHTML='<b>'+(p.name?esc(p.name):'پروفایل کاربر')+'</b><div class="muted small">'+(p.city||p.province?esc((p.city||'')+' '+(p.province||'')):'برای ثبت مشخصات و محل، پروفایل را تکمیل کن')+'</div>'}function profilePage(){let p=prof();g('pn').value=p.name||'';g('pp').value=p.phone||'';g('pv').innerHTML='<option value="">استان</option>'+P.map(x=>'<option '+(p.province===x?'selected':'')+'>'+x+'</option>').join('');g('pc').value=p.city||'';g('pnote').value=p.note||'';show('profile')}function saveProfile(){localStorage.hp=JSON.stringify({name:g('pn').value,phone:g('pp').value,province:g('pv').value,city:g('pc').value,note:g('pnote').value});home()}function visible(){return S.all.filter(q=>!q.cond||q.cond(S.a))}function startCase(cat){let p=prof();S={id:'HY-'+Date.now(),cat,a:{province:p.province||'',city:p.city||''},idx:0,created:new Date().toISOString(),all:[...(E[cat]||[]),...BASE]};show('intake');g('footer').classList.remove('hidden');g('catname').textContent=C[cat][0];render()}function render(){let qs=visible();if(S.idx>=qs.length)S.idx=qs.length-1;let q=qs[S.idx],v=S.a[q.id]||'';g('step').textContent='سؤال '+(S.idx+1)+' از '+qs.length;g('bar').style.width=((S.idx+1)/qs.length*100)+'%';let h='<h3>'+q.x+'</h3>';if(q.t==='area')h+='<textarea id="ans" class="field">'+esc(v)+'</textarea>';else if(q.t==='text')h+='<input id="ans" class="field" value="'+esc(v)+'">';else if(q.t==='select')h+='<select id="ans" class="field"><option value="">انتخاب کن</option>'+q.o.map(o=>'<option '+(v===o?'selected':'')+'>'+o+'</option>').join('')+'</select>';else h+=q.o.map(o=>'<label class="opt"><input type="radio" name="ans" value="'+o+'" '+(v===o?'checked':'')+'> '+o+'</label>').join('');g('qw').innerHTML=h}function capture(){let q=visible()[S.idx],v='';if(q.t==='radio'){let r=document.querySelector('input[name=ans]:checked');v=r?r.value:''}else v=g('ans')?g('ans').value.trim():'';S.a[q.id]=v;localStorage.hdraft=JSON.stringify(S)}function next(){capture();if(S.idx<visible().length-1){S.idx++;render()}else finish()}function prev(){capture();if(S.idx>0){S.idx--;render()}else home()}function num(x){return Number(String(x||'').replace(/[^0-9]/g,'')||0)}function risk(){let a=S.a,n=0,r=[];if(a.urgent==='بله'){n+=3;r.push('مهلت فوری')}if(S.cat==='criminal'){n+=2;r.push('پرونده کیفری')}if(a.safety==='بله'||a.violence==='بله'){n+=5;r.push('خطر ایمنی')}if(a.custody==='بله'){n+=5;r.push('خطر بازداشت')}if(num(a.amount)>=1e9||num(a.value)>=1e9){n+=2;r.push('ارزش مالی بالا')}if(a.stage==='رأی صادر شده'){n+=2;r.push('احتمال مهلت اعتراض')}return{level:n>=5?'قرمز':n>=2?'زرد':'سبز',score:n,reasons:r}}function doc(){let a=S.a;if(a.output&&a.output!=='حق‌یار پیشنهاد دهد')return a.output;if(S.cat==='criminal')return a.criminalRole==='متهم'?'لایحه/دفاعیه':'شکواییه';if(a.stage==='رأی صادر شده')return'لایحه/دفاعیه';if(S.cat==='debt')return'اظهارنامه';if(S.cat==='property'&&a.kind==='تخلیه')return'دادخواست';return'تحلیل و راهکار'}function obj(){let p=prof(),r=risk(),d=doc(),qs=visible();return{schema:'HaghyarLegalIntake/2.0',app_version:'0.4.0',case_id:S.id,created_at:S.created,updated_at:new Date().toISOString(),category:{id:S.cat,title:C[S.cat][0]},user_profile:p,jurisdiction:{province:S.a.province||'',city:S.a.city||''},case_status:{stage:S.a.stage||'',case_number:S.a.caseNo||'',branch:S.a.branch||'',last_notice:S.a.noticeDate||'',deadline:S.a.deadline||''},risk:r,recommended_document:d,desired_outcome:S.a.goal||'',evidence:{documents:S.a.docs||'',strength:S.a.evidence||''},answers:qs.filter(q=>S.a[q.id]).map(q=>({id:q.id,question:q.x,answer:S.a[q.id]})),ai_instruction:'پرونده را بر اساس حقوق ایران تحلیل کن. ابتدا اطلاعات ناقص و تناقض‌ها، سپس ریسک‌ها و مهلت‌ها، اقدامات بعدی، مدارک لازم و در صورت کفایت اطلاعات پیش‌نویس '+d+' را ارائه کن. از قطعیت کاذب پرهیز کن و موارد پرریسک را برای بررسی وکیل علامت بزن.'}}function text(c){let z=['حق‌یار — پرونده AI-ready','شناسه: '+c.case_id,'موضوع: '+c.category.title,'استان/شهر: '+c.jurisdiction.province+' / '+c.jurisdiction.city,'مرحله: '+c.case_status.stage,'ریسک: '+c.risk.level+' '+c.risk.reasons.join('، '),'سند پیشنهادی: '+c.recommended_document,'','=== اطلاعات پرونده ==='];c.answers.forEach(x=>z.push('• '+x.question+'\n'+x.answer+'\n'));z.push('=== دستور AI ===',c.ai_instruction);return z.join('\n')}function finish(){capture();last=obj();let a=list().filter(x=>x.case_id!==last.case_id);a.unshift(last);localStorage.hcases=JSON.stringify(a.slice(0,50));showResult(last)}function showResult(c){last=c;show('result');let cl=c.risk.level==='قرمز'?'red':c.risk.level==='زرد'?'warn':'';g('risk').innerHTML='<span class="pill '+cl+'">ریسک '+c.risk.level+'</span> '+esc(c.risk.reasons.join('، '));g('doc').innerHTML='<b>سند/خروجی پیشنهادی:</b> '+esc(c.recommended_document);g('preview').textContent=text(c)}function historyPage(){show('history');let a=list();g('hist').innerHTML=a.length?a.map(c=>'<div class="case"><b>'+esc(c.category.title)+'</b> <span class="pill">'+c.risk.level+'</span><div class="muted small">'+esc(c.case_status.stage||'مرحله نامشخص')+'</div><button class="btn" onclick="openC(\''+c.case_id+'\')">مشاهده</button></div>').join(''):'<p class="muted">هنوز پرونده‌ای ثبت نشده.</p>'}function openC(id){let c=list().find(x=>x.case_id===id);if(c)showResult(c)}function dl(n,c,m){if(window.Android&&Android.saveFile)Android.saveFile(n,c,m)}function name(){return(last.case_id||'Haghyar')};function outJSON(){dl(name()+'.json',JSON.stringify(last,null,2),'application/json')}function outTXT(){dl(name()+'.txt',text(last),'text/plain')}function outPDF(){if(window.Android&&Android.savePdf)Android.savePdf(name()+'.pdf',text(last))}init();</script></body></html>
