mplate-columns:1fr}.row{flex-direction:column}.money{grid-template-columns:1fr}}</style></head><body><div class="app"><h2>حق‌یار <span class="muted small">v0.5 • آفلاین</span></h2><section id="home"><div class="card hero"><h1>مصاحبه حقوقی تخصصی</h1><p class="muted">سؤال‌ها بر اساس پاسخ‌های قبلی تغییر می‌کنند. هدف، ساخت پرونده‌ای است که AI یا وکیل بتواند بدون حدس‌زدن آن را تحلیل کند.</p></div><div class="card"><h3>موضوع پرونده</h3><div id="cats" class="grid"></div></div><div class="card"><button class="btn" onclick="historyPage()">تاریخچه پرونده‌ها</button></div></section><section id="intake" class="hidden"><div class="card"><div id="crumb" class="muted small"></div><div id="step" style="margin:7px 0"></div><div class="progress"><div id="bar"></div></div><div id="qw"></div></div></section><section id="result" class="hidden"><div class="card"><h2>پرونده AI-ready</h2><div id="risk"></div><p id="ready"></p><p id="doc"></p><pre id="preview"></pre><div class="row"><button class="btn primary" onclick="outJSON()">JSON</button><button class="btn" onclick="outTXT()">متن</button><button class="btn" onclick="outPDF()">PDF</button></div><button class="btn" style="margin-top:8px;width:100%" onclick="home()">صفحه اصلی</button></div></section><section id="history" class="hidden"><div class="card"><h2>تاریخچه</h2><div id="hist"></div><button class="btn" onclick="home()">بازگشت</button></div></section></div><div id="footer" class="footer hidden"><div class="foot"><button class="btn" onclick="prev()">قبلی</button><button class="btn primary" onclick="next()">بعدی</button></div></div><script>

let S=null,last=null;const g=id=>document.getElementById(id),esc=s=>String(s||'').replace(/[&<>\"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','\"':'&quot;'}[c]));function show(x){['home','intake','result','history'].forEach(i=>g(i).classList.toggle('hidden',i!==x));g('footer').classList.add('hidden')}function list(){try{return JSON.parse(localStorage.hcases5||'[]')}catch(e){return[]}}function init(){g('cats').innerHTML=Object.entries(C).map(([k,v])=>'<button class="cat" onclick="startCase(\''+k+'\')"><b>'+v[0]+'</b><span>'+v[1]+'</span></button>').join('');home()}function home(){show('home')}function buildTree(cat){let q=[...(GENERIC[cat]||[])];if(cat==='property')q.push(...RENT.map(x=>({...x,cond:x.cond?((orig)=>a=>a.kind==='اجاره و ودیعه'&&orig(a))(x.cond):a=>a.kind==='اجاره و ودیعه'})));return [...q,...COMMON]}function visible(){return S.all.filter(q=>!q.cond||q.cond(S.a))}function startCase(cat){S={id:'HY-'+Date.now(),cat,a:{},files:[],idx:0,created:new Date().toISOString(),all:buildTree(cat)};show('intake');g('footer').classList.remove('hidden');render()}function render(){let qs=visible();if(S.idx>=qs.length)S.idx=qs.length-1;let q=qs[S.idx],v=S.a[q.id]||'';g('crumb').textContent=C[S.cat][0]+(S.a.kind?' ← '+S.a.kind:'')+(S.a.rentIssue?' ← '+S.a.rentIssue:'');g('step').textContent='سؤال '+(S.idx+1)+' از '+qs.length;g('bar').style.width=((S.idx+1)/qs.length*100)+'%';let h='<h3>'+q.x+(q.req?' *':'')+'</h3>';if(q.t==='area')h+='<textarea id="ans" class="field">'+esc(v)+'</textarea>';else if(q.t==='text'||q.t==='date')h+='<input id="ans" type="'+(q.t==='date'?'date':'text')+'" class="field" value="'+esc(v)+'">';else if(q.t==='money'){let m=v&&typeof v==='object'?v:{amount:'',currency:'تومان'};h+='<div class="money"><input id="moneyAmount" inputmode="numeric" class="field" value="'+esc(m.amount||'')+'" placeholder="مثلاً 1000000000"><select id="moneyCurrency" class="field"><option '+(m.currency==='تومان'?'selected':'')+'>تومان</option><option '+(m.currency==='ریال'?'se
