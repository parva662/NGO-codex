plugins { id 'com.android.application' }

android {
    namespace 'ir.haghyar.offline'
    compileSdk 36
    signingConfigs {
        haghyarDev {
            storeFile rootProject.file('haghyar-dev.jks')
            storePassword 'haghyar-dev-2026'
            keyAlias 'haghyar'
            keyPassword 'haghyar-dev-2026'
        }
    }
    defaultConfig {
        applicationId 'ir.haghyar.finalapp'
        minSdk 24
        targetSdk 36
        versionCode 201
        versionName '2.0.1-test.148'
    }
    buildTypes {
        debug { signingConfig signingConfigs.haghyarDev }
        release { signingConfig signingConfigs.haghyarDev; minifyEnabled false }
    }
}
configurations.configureEach {
    resolutionStrategy {
        force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
        force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
    }
}
dependencies {
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.biometric:biometric:1.1.0'
}
