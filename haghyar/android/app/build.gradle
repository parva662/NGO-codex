plugins { id 'com.android.application' }

android {
    namespace 'ir.haghyar.offline'
    compileSdk 35
    defaultConfig {
        // Keep this applicationId permanently stable so Android treats every
        // future Haghyar APK as an update instead of a different application.
        applicationId 'ir.haghyar.offline'
        minSdk 24
        targetSdk 35
        versionCode 11
        versionName '1.5.0'
    }
}
dependencies { implementation 'androidx.core:core:1.15.0' }
