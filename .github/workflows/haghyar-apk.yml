name: Build Haghyar APK

on:
  push:
    branches: [haghyar-apk]
    paths:
      - 'haghyar/**'
      - '.github/workflows/haghyar-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate interview engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import re,sys
          p=Path('haghyar/android/app/src/main/assets/v1.html')
          s=p.read_text(encoding='utf-8')
          required=['property:','family:','debt:','work:','contract:','criminal:','business:','other:','HaghyarLegalIntake/4.0','v1.0.0','audit()','risk()','attachments']
          missing=[x for x in required if x not in s]
          if missing:
              raise SystemExit('Missing required engine components: '+', '.join(missing))
          m=re.search(r'<script>(.*)</script>',s,re.S)
          if not m: raise SystemExit('Script block missing')
          Path('/tmp/haghyar-engine.js').write_text(m.group(1),encoding='utf-8')
          print('Engine structure OK; HTML bytes:',len(s.encode('utf-8')))
          PY
          node --check /tmp/haghyar-engine.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: haghyar/android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp haghyar/android/app/build/outputs/apk/debug/app-debug.apk Haghyar-v1.0.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haghyar-APK-v1.0.0
          path: Haghyar-v1.0.0.apk
          if-no-files-found: error
