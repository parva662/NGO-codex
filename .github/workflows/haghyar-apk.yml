name: Build DANJUR Commercial MVP
on:
  push:
    branches: [haghyar-apk]
    paths: ['haghyar/**','.github/workflows/haghyar-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore development signing key
        run: base64 --decode haghyar/android/dev-signing-keystore.b64 > haghyar/android/haghyar-dev.jks
      - name: Commercial QA gates
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('haghyar/android/app/src/main/assets')
          main=Path('haghyar/android/app/src/main/java/ir/haghyar/offline/MainActivity.java').read_text(encoding='utf8')
          ui=(p/'v2_commercial_ui.js').read_text(encoding='utf8')
          settings=(p/'v2_settings.js').read_text(encoding='utf8')
          core=(p/'v2_commercial_core.js').read_text(encoding='utf8')
          brief=(p/'v2_lawyer_brief.js').read_text(encoding='utf8')
          post=(p/'v2_post_integration.js').read_text(encoding='utf8')
          ai=(p/'v2_ai_actions.js').read_text(encoding='utf8')
          gradle=Path('haghyar/android/app/build.gradle').read_text()
          manifest=Path('haghyar/android/app/src/main/AndroidManifest.xml').read_text()
          assert "applicationId 'ir.haghyar.finalapp'" in gradle
          assert 'compileSdk 36' in gradle and 'targetSdk 36' in gradle
          assert 'versionCode 202' in gradle and "versionName '2.0.1-test.149'" in gradle
          assert "const V='2.0.0'" in ui and 'autosave:true' in ui and 'privacyCenter:true' in ui
          assert "BUILD='149'" in settings and "VER='2.0.1-test.149'" in settings
          assert 'بدان. بپرس. پیش برو.' in settings
          assert 'active secure draft -> active case -> newest resumable case' in settings
          assert "VERSION='2.0.0'" in core and "version:'2.0.0'" in brief
          for d in ['property','family','debt','work','contract','criminal','business','other']: assert "'"+d+"'" in core
          assert "schema:'DanjurAIPrompt/1.0'" in ai and 'DanjurAIActions' in ai
          assert 'android:allowBackup="false"' in manifest and 'android:usesCleartextTraffic="false"' in manifest
          for x in ['a.save(', 'a.savePdf(', 'a.saveDocx(', 'a.saveZip(']: assert x in ui
          assert 'BiometricPrompt' in main and 'DEVICE_CREDENTIAL' in main and 'FLAG_SECURE' in main
          assert 'v2_post_integration.js' in main and 'aiReadyExport:true' in post
          PY
          node --check haghyar/android/app/src/main/assets/v2_settings.js
          node --check haghyar/android/app/src/main/assets/v2_data_controls.js
          cd haghyar/android
          node qa_help_coverage.js
          node qa_ui_contract.js
          node qa_runtime_interaction.js
          node qa_commercial_50x.js
          node qa_ai_actions.js
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Ensure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-36" "build-tools;36.0.0" "platform-tools"
      - name: Build APK and AAB
        working-directory: haghyar/android
        run: gradle assembleRelease bundleRelease --stacktrace
      - name: Verify test artifacts
        run: |
          cp haghyar/android/app/build/outputs/apk/release/app-release.apk DANJUR-Test-Build-149.apk
          cp haghyar/android/app/build/outputs/bundle/release/app-release.aab DANJUR-Test-Build-149.aab
          unzip -p DANJUR-Test-Build-149.apk assets/v2_commercial_core.js | grep -q "VERSION='2.0.0'"
          unzip -p DANJUR-Test-Build-149.apk assets/v2_ai_actions.js | grep -q "DanjurAIActions"
          unzip -p DANJUR-Test-Build-149.apk assets/v2_settings.js | grep -q "بدان. بپرس. پیش برو."
          unzip -p DANJUR-Test-Build-149.apk assets/v2_settings.js | grep -q "BUILD='149'"
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging DANJUR-Test-Build-149.apk | tee /tmp/badging.txt
          grep -q "package: name='ir.haghyar.finalapp' versionCode='202' versionName='2.0.1-test.149'" /tmp/badging.txt
          grep -q "targetSdkVersion:'36'" /tmp/badging.txt
          sha256sum DANJUR-Test-Build-149.apk DANJUR-Test-Build-149.aab
      - uses: actions/upload-artifact@v4
        with:
          name: DANJUR-Test-Build-149
          path: |
            DANJUR-Test-Build-149.apk
            DANJUR-Test-Build-149.aab
          if-no-files-found: error
