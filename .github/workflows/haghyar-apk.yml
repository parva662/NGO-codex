name: Build Haghyar APK
on:
  push:
    branches: [haghyar-apk]
    paths: ['haghyar/**','.github/workflows/haghyar-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable signing key
        run: base64 --decode haghyar/android/dev-signing-keystore.b64 > haghyar/android/haghyar-dev.jks
      - name: Validate all-domain runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          files=['v1_1.html','v1_2_patch.js','v1_4_knowledge.js','v1_6_ui_fix.js','v1_7_global.js']
          p=Path('haghyar/android/app/src/main/assets')
          for f in files:
            if not (p/f).exists(): raise SystemExit('missing '+f)
          g=(p/'v1_7_global.js').read_text(encoding='utf8')
          for x in ['property','family','debt','work','contract','criminal','business','other','ALL_DOMAINS']:
            if x not in g: raise SystemExit('global coverage missing '+x)
          gradle=Path('haghyar/android/app/build.gradle').read_text()
          for x in ['versionCode 13',"versionName '1.7.0'"]:
            if x not in gradle: raise SystemExit('version mismatch '+x)
          base=(p/'v1_1.html').read_text(encoding='utf8'); m=re.search(r'<script>(.*)</script>',base,re.S)
          Path('/tmp/base.js').write_text(m.group(1),encoding='utf8')
          for f in files[1:]: Path('/tmp/'+f).write_text((p/f).read_text(encoding='utf8'),encoding='utf8')
          PY
          node --check /tmp/base.js
          node --check /tmp/v1_2_patch.js
          node --check /tmp/v1_4_knowledge.js
          node --check /tmp/v1_6_ui_fix.js
          node --check /tmp/v1_7_global.js
      - name: Full scenario QA
        working-directory: haghyar/android
        run: node qa_runner.js
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Ensure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build signed release
        working-directory: haghyar/android
        run: gradle assembleRelease --stacktrace
      - name: Package APK
        run: cp haghyar/android/app/build/outputs/apk/release/app-release.apk Haghyar-v1.7.0.apk
      - uses: actions/upload-artifact@v4
        with: {name: Haghyar-APK-v1.7.0, path: Haghyar-v1.7.0.apk, if-no-files-found: error}
