name: Build Haghyar APK
on:
  push:
    branches: [haghyar-apk]
    paths: ['haghyar/**','.github/workflows/haghyar-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable signing key
        run: base64 --decode haghyar/android/dev-signing-keystore.b64 > haghyar/android/haghyar-dev.jks
      - name: Validate final standalone runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('haghyar/android/app/src/main/assets')
          main=Path('haghyar/android/app/src/main/java/ir/haghyar/offline/MainActivity.java').read_text(encoding='utf8')
          ui=(p/'v1_6_ui_fix.js').read_text(encoding='utf8')
          gradle=Path('haghyar/android/app/build.gradle').read_text()
          assert "applicationId 'ir.haghyar.finalapp'" in gradle
          assert 'versionCode 181' in gradle and "versionName '1.8.1-final'" in gradle
          assert "V='1.8.1'" in ui and 'exportsFixed:true' in ui
          for x in ['a.save(', 'a.savePdf(', 'a.saveDocx(', 'a.saveZip(']: assert x in ui, 'missing export '+x
          for x in ['@JavascriptInterface public void save(', '@JavascriptInterface public void savePdf(', '@JavascriptInterface public void saveDocx(', '@JavascriptInterface public void saveZip(']: assert x in main, 'missing bridge '+x
          PY
          cd haghyar/android && node qa_runner.js
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Ensure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build standalone signed release
        working-directory: haghyar/android
        run: gradle assembleRelease --stacktrace
      - name: Verify standalone APK
        run: |
          cp haghyar/android/app/build/outputs/apk/release/app-release.apk Haghyar-FINAL-v1.8.1.apk
          unzip -p Haghyar-FINAL-v1.8.1.apk assets/v1_6_ui_fix.js | grep -q "V='1.8.1'"
          unzip -p Haghyar-FINAL-v1.8.1.apk assets/v1_6_ui_fix.js | grep -q 'exportsFixed:true'
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Haghyar-FINAL-v1.8.1.apk | tee /tmp/badging.txt
          grep -q "package: name='ir.haghyar.finalapp' versionCode='181' versionName='1.8.1-final'" /tmp/badging.txt
          sha256sum Haghyar-FINAL-v1.8.1.apk
      - uses: actions/upload-artifact@v4
        with: {name: Haghyar-FINAL-Standalone-v1.8.1, path: Haghyar-FINAL-v1.8.1.apk, if-no-files-found: error}
