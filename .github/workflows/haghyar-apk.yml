name: Build Haghyar APK

on:
  push:
    branches: [haghyar-apk]
    paths:
      - 'haghyar/**'
      - '.github/workflows/haghyar-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate interview engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base=Path('haghyar/android/app/src/main/assets/v1_1.html').read_text(encoding='utf-8')
          p12=Path('haghyar/android/app/src/main/assets/v1_2_patch.js').read_text(encoding='utf-8')
          p13=Path('haghyar/android/app/src/main/assets/v1_3_patch.js').read_text(encoding='utf-8')
          required=['property:','family:','debt:','work:','contract:','criminal:','business:','other:','jalali_to_gregorian','handoverClause']
          miss=[x for x in required if x not in base]
          miss += [x for x in ['earlyTerminationReason','ready_for_ai','savePdfBundle'] if x not in p12]
          miss += [x for x in ['1.3.0','HaghyarLegalIntake/7.0','HaghyarQA','arrearsAmountKnown','hy-help','financial_wording'] if x not in p13]
          if miss: raise SystemExit('Missing required v1.3 components: '+', '.join(miss))
          m=re.search(r'<script>(.*)</script>',base,re.S)
          if not m: raise SystemExit('Base script missing')
          Path('/tmp/haghyar-base.js').write_text(m.group(1),encoding='utf-8')
          Path('/tmp/haghyar-p12.js').write_text(p12,encoding='utf-8')
          Path('/tmp/haghyar-p13.js').write_text(p13,encoding='utf-8')
          PY
          node --check /tmp/haghyar-base.js
          node --check /tmp/haghyar-p12.js
          node --check /tmp/haghyar-p13.js
      - name: Run scenario QA
        working-directory: haghyar/android
        run: node qa_runner.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: haghyar/android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp haghyar/android/app/build/outputs/apk/debug/app-debug.apk Haghyar-v1.3.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haghyar-APK-v1.3.0
          path: Haghyar-v1.3.0.apk
          if-no-files-found: error
