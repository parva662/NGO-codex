name: Build Haghyar APK

on:
  push:
    branches: [haghyar-apk]
    paths:
      - 'haghyar/**'
      - '.github/workflows/haghyar-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate interview engine
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          base=Path('haghyar/android/app/src/main/assets/v1_1.html').read_text(encoding='utf-8')
          patch=Path('haghyar/android/app/src/main/assets/v1_2_patch.js').read_text(encoding='utf-8')
          required_base=['property:','family:','debt:','work:','contract:','criminal:','business:','other:','HaghyarLegalIntake/5.0','jalali_to_gregorian','handoverClause','leaseEnd']
          required_patch=['1.2.0','HaghyarLegalIntake/6.0','editIssue','showHelp','ready_for_ai','ready_for_final_document','earlyTerminationReason','savePdfBundle']
          miss=[x for x in required_base if x not in base]+[x for x in required_patch if x not in patch]
          if miss: raise SystemExit('Missing required v1.2 components: '+', '.join(miss))
          m=re.search(r'<script>(.*)</script>',base,re.S)
          if not m: raise SystemExit('Base script missing')
          Path('/tmp/haghyar-base.js').write_text(m.group(1),encoding='utf-8')
          Path('/tmp/haghyar-patch.js').write_text(patch,encoding='utf-8')
          print('Base and v1.2 patch structure OK')
          PY
          node --check /tmp/haghyar-base.js
          node --check /tmp/haghyar-patch.js
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: haghyar/android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp haghyar/android/app/build/outputs/apk/debug/app-debug.apk Haghyar-v1.2.0.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haghyar-APK-v1.2.0
          path: Haghyar-v1.2.0.apk
          if-no-files-found: error
