name: Build Haghyar APK

on:
  push:
    branches: [haghyar-apk]
    paths:
      - 'haghyar/**'
      - '.github/workflows/haghyar-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Ensure Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build debug APK
        working-directory: haghyar/android
        run: gradle assembleDebug --stacktrace
      - name: Rename APK
        run: cp haghyar/android/app/build/outputs/apk/debug/app-debug.apk Haghyar-Offline-v0.3.apk
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haghyar-Offline-APK
          path: Haghyar-Offline-v0.3.apk
          if-no-files-found: error
