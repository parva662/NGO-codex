name: Build Haghyar APK
on:
  push:
    branches: [haghyar-apk]
    paths: ['haghyar/**','.github/workflows/haghyar-apk.yml']
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore stable signing key
        run: base64 --decode haghyar/android/dev-signing-keystore.b64 > haghyar/android/haghyar-dev.jks
      - name: Validate final standalone runtime
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('haghyar/android/app/src/main/assets')
          main=Path('haghyar/android/app/src/main/java/ir/haghyar/offline/MainActivity.java').read_text(encoding='utf8')
          manifest=Path('haghyar/android/app/src/main/AndroidManifest.xml').read_text(encoding='utf8')
          ui=(p/'v1_6_ui_fix.js').read_text(encoding='utf8')
          gradle=Path('haghyar/android/app/build.gradle').read_text()
          assert 'android:name=".MainActivity"' in manifest
          assert 'MainActivityV13' not in manifest
          assert 'readAsset("v1_6_ui_fix.js")' in main
          assert "applicationId 'ir.haghyar.finalapp'" in gradle
          assert 'versionCode 180' in gradle and "versionName '1.8.0-final'" in gradle
          for x in ['property','family','debt','work','contract','criminal','business','other','singleHelp:true','offlineKnowledge:true',"V='1.8.0'"]:
            assert x in ui, 'missing '+x
          PY
          node haghyar/android/qa_runner.js
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: gradle/actions/setup-gradle@v4
        with: {gradle-version: '8.9'}
      - name: Ensure Android SDK
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Build standalone signed release
        working-directory: haghyar/android
        run: gradle assembleRelease --stacktrace
      - name: Verify standalone APK
        run: |
          cp haghyar/android/app/build/outputs/apk/release/app-release.apk Haghyar-FINAL-v1.8.0.apk
          unzip -l Haghyar-FINAL-v1.8.0.apk | grep -q 'assets/v1_6_ui_fix.js'
          unzip -p Haghyar-FINAL-v1.8.0.apk assets/v1_6_ui_fix.js | grep -q "V='1.8.0'"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging Haghyar-FINAL-v1.8.0.apk | tee /tmp/badging.txt
          grep -q "package: name='ir.haghyar.finalapp' versionCode='180' versionName='1.8.0-final'" /tmp/badging.txt
          grep -q "application-label:'حق‌یار نهایی'" /tmp/badging.txt
          sha256sum Haghyar-FINAL-v1.8.0.apk
      - uses: actions/upload-artifact@v4
        with: {name: Haghyar-FINAL-Standalone-v1.8.0, path: Haghyar-FINAL-v1.8.0.apk, if-no-files-found: error}
